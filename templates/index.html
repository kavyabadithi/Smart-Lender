<!DOCTYPE html>
<html>

<head>
    <title>Smart Lender</title>
</head>

<body>

<h1>Smart Lender</h1>

<form action="/predict" method="POST">

Gender:
<select name="Gender">
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select><br><br>

Married:
<select name="Married">
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select><br><br>

Education:
<select name="Education">
  <option value="Graduate">Graduate</option>
  <option value="Not Graduate">Not Graduate</option>
</select><br><br>

Self Employed:
<select name="Self_Employed">
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select><br><br>

Applicant Income:
<input type="number" name="ApplicantIncome"><br><br>

Coapplicant Income:
<input type="number" name="CoapplicantIncome"><br><br>

Loan Amount:
<input type="number" name="LoanAmount"><br><br>

Loan Term:
<input type="number" name="Loan_Amount_Term"><br><br>

Credit History:
<select name="Credit_History">
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select><br><br>

Property Area:
<select name="Property_Area">
  <option value="Urban">Urban</option>
  <option value="Semiurban">Semiurban</option>
  <option value="Rural">Rural</option>
</select><br><br>

<input type="submit" value="Predict">

</form>

</body>

</html>
